<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WANI — Markdown presentation</title>
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/assets/highlight.css">
</head>
<body class="presentation-view">
<header class="toolbar">
  <a class="brand" href="#slide=1" aria-label="WANI: 最初のスライド">WANI<span>Web Assembly Narrative Illustrator</span></a>
  <nav aria-label="プレゼンテーション操作">
    <button id="previous" title="前へ (← / PageUp)" disabled>←</button>
    <output id="position" aria-live="polite">— / —</output>
    <button id="next" title="次へ (→ / Space / PageDown)" disabled>→</button>
    <span class="toolbar-divider"></span>
    <button id="reload-slides" title="スライドを再読み込み" disabled>再読み込み</button>
    <button id="fullscreen" title="全画面 (F)" disabled>全画面 (F)</button>
    <button id="speaker" title="発表者ノート (N)" disabled>ノート (N)</button>
    <button id="print" disabled>PDF</button>
    <button id="print-notes" disabled>ノート付き PDF</button>
  </nav>
</header>
<p id="status" role="status">Ruby を読み込んでいます…</p>
<aside id="warnings" role="status" hidden></aside>
<div id="viewport"><main id="stage" aria-label="スライド"></main></div>
<section id="start-overlay" role="dialog" aria-label="発表の開始" hidden>
  <button id="start-presentation">スタート</button>
</section>
<output id="countdown" aria-live="off" aria-label="発表の残り時間" hidden></output>
<section id="time-expired" role="dialog" aria-modal="true" aria-labelledby="time-expired-title" hidden>
  <h1 id="time-expired-title">時間切れです！</h1>
  <img id="time-expired-image" class="time-expired-image" width="1200" height="900" alt="ウサギとサメのイラスト">
  <p>← または → キーで元のスライドに戻れます</p>
  <button id="resume-slides">スライドに戻る</button>
</section>
<footer class="help">← → ページ移動 <span>Home / End 最初・最後</span></footer>
<article id="print-pages" aria-hidden="true"></article>
<script src="/assets/runtime.pr672.js" data-ruby-wasm-url="/assets/wani.wasm"></script>
<script type="text/ruby" data-eval="async" src="/assets/bootstrap.rb"></script>
</body>
</html>
