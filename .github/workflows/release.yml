name: Publish gem

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Check tag matches gem version
        run: |
          ruby -r ./lib/wani/version -e '
            abort "Tag and version do not match" unless
              ENV.fetch("GITHUB_REF_NAME") == "v#{Wani::VERSION}"
          '

      - run: npm ci

      - name: Build minimal WASM, run Ruby tests, and package gem
        run: bundle exec rake package:minimal

      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm test

      - name: Packaged gem smoke test
        run: bundle exec ruby scripts/smoke_package.rb

      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@c6ca7f4bac0e29c9bde8eeae0a0a986b27efa05f # v2.2.0

      - name: Publish to RubyGems.org
        run: |
          version=$(ruby -r ./lib/wani/version -e 'print Wani::VERSION')
          gem push "wani-${version}.gem"
